<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      GitHub Pages SPA-Workaround:
      Leitet alle 404-Anfragen zurück zur index.html,
      damit React Router / Anchor-Links funktionieren.
    -->
    <script>
      // Speichere den Pfad im sessionStorage und leite zu / weiter
      const path = window.location.pathname;
      sessionStorage.setItem('ghpages_redirect', path);
      window.location.replace('/');
    </script>
  </head>
  <body></body>
</html>
