backend:
  name: git-gateway
  branch: claude/fix-netlify-deployment-0cEyK
  identity_url: https://abacus-webtesting.netlify.app/.netlify/identity
  site_url: https://abacus-webtesting.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "homepage"
    label: "Homepage"
    files:
      - name: "content"
        label: "Seiteninhalt"
        file: "content.json"
        format: json
        fields:

          # ── HERO ──────────────────────────────────────────
          - label: "Hero-Bereich"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Badge-Text",              name: "badge",               widget: "string" }
              - { label: "Überschrift (Zeile 1)",   name: "headline_main",       widget: "string" }
              - { label: "Überschrift (Zeile 2, rot)", name: "headline_highlight", widget: "string" }
              - { label: "Untertext",               name: "subtext",             widget: "text" }
              - { label: "Button 1 – Text",         name: "cta_primary",         widget: "string" }
              - { label: "Button 2 – Text",         name: "cta_secondary",       widget: "string" }

          # ── STATS ─────────────────────────────────────────
          - label: "Kennzahlen (Hero)"
            name: "stats"
            widget: "list"
            collapsed: true
            fields:
              - { label: "Wert (z.B. 15+)",  name: "value", widget: "string" }
              - { label: "Bezeichnung",       name: "label", widget: "string" }

          # ── SERVICES ──────────────────────────────────────
          - label: "Leistungen"
            name: "services"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Badge",      name: "badge",    widget: "string" }
              - { label: "Überschrift", name: "headline", widget: "string" }
              - { label: "Untertext",  name: "subtext",  widget: "text" }
              - label: "Leistungskarten"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Titel",       name: "title",       widget: "string" }
                  - { label: "Beschreibung", name: "description", widget: "text" }

          # ── WHY ───────────────────────────────────────────
          - label: "Warum Abacus Solutions"
            name: "why"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Badge",      name: "badge",    widget: "string" }
              - { label: "Überschrift", name: "headline", widget: "string" }
              - { label: "Untertext",  name: "subtext",  widget: "text" }
              - label: "Vorteile"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Titel",        name: "title",       widget: "string" }
                  - { label: "Beschreibung", name: "description", widget: "text" }

          # ── TESTIMONIALS ───────────────────────────────────
          - label: "Referenzen / Testimonials"
            name: "testimonials"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Badge",      name: "badge",    widget: "string" }
              - { label: "Überschrift", name: "headline", widget: "string" }
              - label: "Zitate"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Zitat",           name: "quote",    widget: "text" }
                  - { label: "Name",             name: "name",     widget: "string" }
                  - { label: "Position / Firma", name: "role",     widget: "string" }
                  - { label: "Initialen (2 Buchstaben)", name: "initials", widget: "string" }

          # ── CTA ───────────────────────────────────────────
          - label: "CTA-Bereich (roter Abschnitt)"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Badge",                  name: "badge",           widget: "string" }
              - { label: "Überschrift (Zeile 1)",  name: "headline_main",   widget: "string" }
              - { label: "Überschrift (Zeile 2)",  name: "headline_suffix", widget: "string" }
              - { label: "Untertext",              name: "subtext",         widget: "text" }
              - { label: "Button 1 – Text",        name: "cta_primary",     widget: "string" }
              - { label: "Button 2 – Text",        name: "cta_secondary",   widget: "string" }

          # ── CONTACT ───────────────────────────────────────
          - label: "Kontakt-Bereich"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Badge",      name: "badge",    widget: "string" }
              - { label: "Überschrift", name: "headline", widget: "string" }
              - { label: "Untertext",  name: "subtext",  widget: "text" }
              - { label: "Telefon",    name: "phone",    widget: "string" }
              - { label: "E-Mail",     name: "email",    widget: "string" }
              - { label: "Adresse",    name: "address",  widget: "string" }

          # ── FOOTER ────────────────────────────────────────
          - label: "Footer"
            name: "footer"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Slogan / Tagline", name: "tagline", widget: "text" }

      - name: "metadata"
        label: "Metadaten"
        file: "metadata.json"
        format: json
        fields:

          # ── SEO ───────────────────────────────────────────
          - label: "SEO"
            name: "seo"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Meta Title",       name: "title",       widget: "string",   hint: "Seitentitel im Browser-Tab und in Suchergebnissen (empfohlen: 50–60 Zeichen)" }
              - { label: "Meta Description", name: "description", widget: "text",     hint: "Kurzbeschreibung für Suchergebnisse (empfohlen: 150–160 Zeichen)" }
              - { label: "Canonical URL",    name: "canonical",   widget: "string",   required: false, hint: "Kanonische URL, falls abweichend von der Standard-URL" }

          # ── OPEN GRAPH ────────────────────────────────────
          - label: "Open Graph (Social Media)"
            name: "og"
            widget: "object"
            collapsed: true
            fields:
              - { label: "OG Title",       name: "title",       widget: "string",   required: false, hint: "Titel beim Teilen auf Facebook, LinkedIn usw. (Standard: Meta Title)" }
              - { label: "OG Description", name: "description", widget: "text",     required: false, hint: "Beschreibung beim Teilen (Standard: Meta Description)" }
              - { label: "OG Bild",        name: "image",       widget: "image",    required: false, hint: "Vorschaubild beim Teilen (empfohlen: 1200 × 630 px)" }
              - { label: "OG Typ",         name: "type",        widget: "select",   required: false, default: "website", options: ["website", "article"] }

          # ── TWITTER CARD ──────────────────────────────────
          - label: "Twitter / X Card"
            name: "twitter"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Card-Typ",        name: "card",        widget: "select",   required: false, default: "summary_large_image", options: ["summary", "summary_large_image"] }
              - { label: "Twitter Title",   name: "title",       widget: "string",   required: false, hint: "Titel für Twitter/X (Standard: OG Title)" }
              - { label: "Twitter Description", name: "description", widget: "text", required: false, hint: "Beschreibung für Twitter/X (Standard: OG Description)" }
              - { label: "Twitter Bild",    name: "image",       widget: "image",    required: false, hint: "Bild für Twitter/X Card (empfohlen: 1200 × 628 px)" }

          # ── ROBOTS ────────────────────────────────────────
          - label: "Indexierung (Robots)"
            name: "robots"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Seite indexieren",   name: "index",  widget: "boolean", default: true,  hint: "Seite in Suchmaschinen aufnehmen (index / noindex)" }
              - { label: "Links folgen",        name: "follow", widget: "boolean", default: true,  hint: "Suchmaschinen-Crawler dürfen Links folgen (follow / nofollow)" }
